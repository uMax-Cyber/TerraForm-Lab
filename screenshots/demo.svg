<svg width="800" height="320" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="320" fill="#1e1e2e" rx="8"/>
<rect width="800" height="30" fill="#181825" rx="8"><animate attributeName="opacity" values="1;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="20" cy="15" r="6" fill="#f38ba8"/><circle cx="40" cy="15" r="6" fill="#f9e2af"/><circle cx="60" cy="15" r="6" fill="#a6e3a1"/>
<text x="400" y="20" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">terraform plan</text>
<text x="15" y="55" fill="#a6e3a1" font-family="monospace" font-size="13">$ terraform plan</text>
<text x="15" y="85" fill="#89b4fa" font-family="monospace" font-size="14">Terraform will perform the following actions:</text>
<text x="15" y="115" fill="#cdd6f4" font-family="monospace" font-size="14">  # module.webserver.proxmox_virtual_environment_vm.vm</text>
<text x="15" y="140" fill="#cdd6f4" font-family="monospace" font-size="14">  + name       = "web-01"</text>
<text x="15" y="165" fill="#cdd6f4" font-family="monospace" font-size="14">  + vm_id      = 201</text>
<text x="15" y="190" fill="#cdd6f4" font-family="monospace" font-size="14">  + cores      = 2</text>
<text x="15" y="215" fill="#cdd6f4" font-family="monospace" font-size="14">  + memory     = 2048</text>
<text x="15" y="240" fill="#cdd6f4" font-family="monospace" font-size="14">  + disk       = 20GB (scsi0)</text>
<text x="15" y="265" fill="#a6e3a1" font-family="monospace" font-size="14">Plan: 1 to add, 0 to change, 0 to destroy.</text>
<rect x="15" y="430" width="10" height="18" fill="#a6e3a1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>